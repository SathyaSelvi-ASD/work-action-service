# ============================================================
# Application
# ============================================================
spring.application.name=work-action-service

# Kafka consumer - receipt display events from Disclosure service
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_RECEIPT_DISPLAY_GROUP:work-action-receipt-display}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vbox.workaction.messaging
spring.kafka.consumer.properties.spring.json.value.default.type=com.vbox.workaction.messaging.ReceiptDisplayEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
app.kafka.topics.receipt-display=${KAFKA_RECEIPT_DISPLAY_TOPIC:receipt-display}
app.kafka.consumer.receipt-display-group=${KAFKA_RECEIPT_DISPLAY_GROUP:work-action-receipt-display}
app.kafka.consumer.receipt-display-auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}
# ============================================================
# MySQL - DEV
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ============================================================
# Hikari Connection Pool
# ============================================================
spring.datasource.hikari.pool-name=work-action-service-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_THRESHOLD:60000}
# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.open-in-view=false
# Prefer validate/update depending on your DEV deployment strategy.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
# ============================================================
# Messages
# ============================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# ============================================================
# Disclosure Service Configuration
# ============================================================
disclosure.base-url=${DISCLOSURE_BASE_URL}
disclosure.service.search-url=${DISCLOSURE_SERVICE_SEARCH_URL:/api/disclosures/v1/search}
disclosure.service.timeout=${DISCLOSURE_TIMEOUT:5000}
disclosure.service.read-timeout=${DISCLOSURE_READ_TIMEOUT:5000}
# ============================================================
# Actuator / Monitoring
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
# DEV tracing - adjust based on your tracing infrastructure
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.com.vbox.disclosure=INFO
logging.level.org.hibernate.SQL=WARN
