```properties=
# ============================================================
# Application
# ============================================================
spring.application.name=work-action-service
# ============================================================
# MySQL - Local
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disclosure_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ============================================================
# Hikari Connection Pool
# ============================================================
spring.datasource.hikari.pool-name=work-action-service-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# ============================================================
# Messages
# ============================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# ============================================================
# Disclosure Service Configuration
# ============================================================
disclosure.base-url=${DISCLOSURE_BASE_URL:http://localhost:8080}
disclosure.service.search-url=${DISCLOSURE_SERVICE_SEARCH_URL:/api/disclosures/v1/search}
disclosure.service.timeout=5000
disclosure.service.read-timeout=5000
# ============================================================
# Actuator / Monitoring
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
# Enable 100% tracing locally
management.tracing.sampling.probability=1.0
# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.com.vbox.disclosure=INFO
logging.level.org.hibernate.SQL=WARN
# ============================================================
# Server
# ============================================================
server.port=${SERVER_PORT:8081}