# ============================================================
# Application
# ============================================================
spring.application.name=work-action-service-test
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vbox.workaction.messaging
spring.kafka.consumer.properties.spring.json.value.default.type=com.vbox.workaction.messaging.ReceiptDisplayEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
app.kafka.topics.receipt-display=receipt-display-test
app.kafka.consumer.receipt-display-group=work-action-receipt-display-test
app.kafka.consumer.receipt-display-auto-startup=false

# ============================================================
# MySQL - Local
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disclosure_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootmysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# Flyway - disabled for tests (Hibernate manages schema)
# ============================================================
spring.flyway.enabled=false

# ============================================================
# Messages
# ============================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ============================================================
# Disclosure Service Configuration
# ============================================================
disclosure.base-url=${DISCLOSURE_BASE_URL:http://localhost:8080}
disclosure.service.search-url=${DISCLOSURE_SERVICE_SEARCH_URL:/api/disclosures/v1/search}
disclosure.service.timeout=5000
disclosure.service.read-timeout=5000

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics

# ============================================================
# Tracing
# ============================================================
management.tracing.sampling.probability=0.0

# ============================================================
# Logging
# ============================================================
logging.level.root=WARN
logging.level.com.vbox.disclosure=INFO
logging.level.org.hibernate.SQL=WARN
