# ============================================================
# Application
# ============================================================
spring.application.name=work-action-service-test

# ============================================================
# MySQL - Local
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disclosure_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootmysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# Flyway - disabled for tests (Hibernate manages schema)
# ============================================================
spring.flyway.enabled=false

# ============================================================
# Messages
# ============================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics

# ============================================================
# Tracing
# ============================================================
management.tracing.sampling.probability=0.0

# ============================================================
# Logging
# ============================================================
logging.level.root=WARN
logging.level.com.vbox.disclosure=INFO
logging.level.org.hibernate.SQL=WARN
